<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizza Master PRO</title>
    
    <link rel="manifest" href="/PizzaMaster/manifest.json">
    <meta name="theme-color" content="#f37021">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ImAbbasi/my-assets/main/logo.png">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #111827; --accent: #f37021; --success: #22c55e; --error: #ef4444; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; height: 100%; background: #f3f4f6; overflow: hidden; }
        header { background: var(--primary); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent); z-index: 2000; position: relative; }
        .screen { display: none; height: calc(100vh - 60px); width: 100vw; position: relative; }
        .active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 15px; border: 2px solid #d1d5db; border-radius: 12px; margin-top: 12px; font-size: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 16px; border-radius: 50px; border: none; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; }
        .btn-primary { background: var(--accent); color: white; }
        #map { height: 100%; width: 100%; z-index: 1; }
        #admin-panel { position: absolute; top: 10px; left: 10px; z-index: 1000; background: white; padding: 15px; border-radius: 15px; width: 200px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 11px; }
        .error-text { color: var(--error); font-weight: bold; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <div style="display: flex; align-items: center;">
        <img src="https://raw.githubusercontent.com/ImAbbasi/my-assets/main/logo.png" style="height:30px; margin-right:10px;">
        <div style="font-weight:bold;">PIZZA <span style="color:var(--accent)">MASTER</span></div>
    </div>
</header>

<div id="screen-start" class="screen active">
    <div class="card">
        <h2>Rider Login</h2>
        <input type="text" id="riderName" placeholder="Enter Your Name">
        <button class="btn btn-primary" onclick="startTracking()">START SHIFT</button>
        <button onclick="showScreen('screen-admin-login')" style="margin-top:20px; background:none; border:none; color:#6b7280; text-decoration:underline;">Admin Portal</button>
    </div>
</div>

<div id="screen-admin-login" class="screen">
    <div class="card">
        <h3>Admin Access</h3>
        <input type="password" id="adminPass" placeholder="Password">
        <button class="btn btn-primary" onclick="adminAuth()">VERIFY</button>
        <button onclick="showScreen('screen-start')" style="margin-top:15px; border:none; background:none; color:#999;">Back</button>
    </div>
</div>

<div id="screen-rider-active" class="screen">
    <div class="card">
        <h1 id="activeNameDisplay"></h1>
        <div style="font-size: 60px; margin: 10px;">📡</div>
        <p><b id="statusTitle" style="color: var(--success);">INITIALIZING...</b></p>
        <div id="myStats" style="font-size: 14px; text-align: left; background: #fff7ed; padding: 15px; border-radius: 12px; min-height: 60px;">
            Connecting to satellites...
        </div>
        <button id="retryBtn" onclick="startTracking()" class="btn" style="display:none; background:var(--primary); color:white;">RETRY GPS</button>
        <button onclick="location.reload()" class="btn" style="background:#fee2e2; color:#b91c1c;">END SHIFT</button>
    </div>
</div>

<div id="screen-admin-map" class="screen" style="display:none;">
    <div id="admin-panel">
        <b style="color:var(--accent);">FLEET MONITOR</b><hr>
        <div id="rider-list">Locating riders...</div>
    </div>
    <div id="map"></div>
</div>

<audio id="keepAlive" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA=="></audio>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/PizzaMaster/sw.js', { scope: '/PizzaMaster/' });
    }

    const firebaseConfig = { databaseURL: "https://ovenx-tracking-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const HQ = [29.5298, 71.6319]; 
    let map, markers = {}, paths = {}, wakeLock = null, watchID = null;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        const target = document.getElementById(id);
        target.style.display = (id === 'screen-admin-map') ? 'block' : 'flex';
        if(id === 'screen-admin-map') setTimeout(() => { initAdminMap(); }, 300);
    }

    function adminAuth() {
        if(document.getElementById('adminPass').value === '1234') showScreen('screen-admin-map');
        else alert("Wrong Password");
    }

    function initAdminMap() {
        if(map) { map.invalidateSize(); return; }
        map = L.map('map', { zoomControl: false }).setView(HQ, 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.marker(HQ).addTo(map).bindTooltip("HQ", {permanent:true});

        db.ref('riders').on('value', snap => {
            const data = snap.val();
            const list = document.getElementById('rider-list');
            list.innerHTML = '';
            for(let id in data) {
                const r = data[id];
                if((Date.now() - r.t) < 600000) {
                    const pos = [r.lat, r.lng];
                    if(markers[id]) markers[id].setLatLng(pos);
                    else markers[id] = L.marker(pos).addTo(map).bindTooltip(r.name, {permanent:true});
                    if(!paths[id]) paths[id] = L.polyline([], {color: '#f37021', weight: 4}).addTo(map);
                    paths[id].addLatLng(pos);
                    list.innerHTML += `<div style="padding:5px 0; border-bottom:1px solid #eee;"><b>${r.name}</b>: ${r.speed || 0} km/h</div>`;
                }
            }
        });
    }

    async function startTracking() {
        const name = document.getElementById('riderName').value;
        if(!name) return alert("Please enter your name");

        showScreen('screen-rider-active');
        document.getElementById('activeNameDisplay').innerText = name;
        document.getElementById('retryBtn').style.display = 'none';

        // Keep CPU Awake
        document.getElementById('keepAlive').play();
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}

        if (watchID) navigator.geolocation.clearWatch(watchID);

        watchID = navigator.geolocation.watchPosition(pos => {
            const speed = pos.coords.speed ? Math.floor(pos.coords.speed * 3.6) : 0;
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            db.ref('riders/' + name.replace(/\s/g,'_')).set({
                name, lat, lng, speed, t: Date.now()
            });

            document.getElementById('statusTitle').style.color = "var(--success)";
            document.getElementById('statusTitle').innerText = "TRACKING LIVE";
            document.getElementById('myStats').innerHTML = `🚀 Speed: ${speed} km/h<br>📡 Accuracy: ${Math.round(pos.coords.accuracy)}m<br>📍 GPS: Online`;
        }, (err) => {
            document.getElementById('statusTitle').style.color = "var(--error)";
            document.getElementById('statusTitle').innerText = "GPS ERROR";
            document.getElementById('retryBtn').style.display = 'block';
            
            let errorMsg = "";
            switch(err.code) {
                case 1: errorMsg = "Permission Denied. Please allow location in your browser settings."; break;
                case 2: errorMsg = "Position Unavailable. Move to an open area (outdoor)."; break;
                case 3: errorMsg = "GPS Timeout. Still trying to find your signal..."; break;
                default: errorMsg = "An unknown error occurred."; break;
            }
            document.getElementById('myStats').innerHTML = `<span class="error-text">${errorMsg}</span>`;
        }, { 
            enableHighAccuracy: true, 
            maximumAge: 0, 
            timeout: 15000 
        });
    }
</script>
</body>
</html>
