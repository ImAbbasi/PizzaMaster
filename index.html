<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizza Master PRO</title>
    
    <link rel="manifest" href="/PizzaMaster/manifest.json">
    <meta name="theme-color" content="#f37021">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #111827; --accent: #f37021; --success: #22c55e; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; height: 100%; background: #f3f4f6; overflow: hidden; }
        header { background: var(--primary); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent); }
        .screen { display: none; height: calc(100vh - 60px); width: 100vw; position: relative; }
        .active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn { width: 100%; padding: 16px; border-radius: 50px; border: none; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; }
        .btn-primary { background: var(--accent); color: white; }
        #map { height: 100%; width: 100%; }
        #admin-panel { position: absolute; top: 10px; left: 10px; z-index: 1000; background: white; padding: 10px; border-radius: 10px; width: 180px; font-size: 11px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:bold;">PIZZA <span style="color:var(--accent)">MASTER</span></div>
</header>

<audio id="bgAudio" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA=="></audio>

<div id="screen-start" class="screen active">
    <div class="card">
        <h2>Rider Portal</h2>
        <input type="text" id="riderName" placeholder="Name" style="width:100%; padding:12px; margin-top:10px; border-radius:10px; border:1px solid #ccc;">
        <button class="btn btn-primary" onclick="startTracking()">GO ONLINE</button>
        <button onclick="showScreen('screen-admin-login')" style="margin-top:15px; background:none; border:none; color:#6b7280;">Admin Login</button>
    </div>
</div>

<div id="screen-admin-login" class="screen">
    <div class="card">
        <h3>Admin Access</h3>
        <input type="password" id="adminPass" placeholder="Password" style="width:100%; padding:12px; margin-top:10px;">
        <button class="btn btn-primary" onclick="adminAuth()">LOGIN</button>
    </div>
</div>

<div id="screen-rider-active" class="screen">
    <div class="card">
        <h1 id="activeNameDisplay"></h1>
        <div style="font-size: 50px;">🛵</div>
        <p><b style="color:var(--success)">TRACKING IN BACKGROUND</b></p>
        <p style="font-size:12px; color:#666;">Keep this tab open. You can lock your screen now.</p>
        <div id="myStats" style="font-size: 13px; background:#f9f9f9; padding:10px; border-radius:10px;">Waiting...</div>
        <button onclick="location.reload()" class="btn" style="background:#fee2e2; color:#b91c1c;">OFF DUTY</button>
    </div>
</div>

<div id="screen-admin-map" class="screen">
    <div id="admin-panel"><b>FLEET</b><hr><div id="rider-list"></div></div>
    <div id="map"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://ovenx-tracking-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const HQ = [29.5298, 71.6319]; 
    let map, markers = {}, wakeLock = null;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = (id === 'screen-admin-map') ? 'block' : 'flex';
        if(id === 'screen-admin-map') setTimeout(initAdminMap, 300);
    }

    function adminAuth() {
        if(document.getElementById('adminPass').value === '1234') showScreen('screen-admin-map');
    }

    function initAdminMap() {
        if(map) return;
        map = L.map('map').setView(HQ, 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        db.ref('riders').on('value', snap => {
            const data = snap.val();
            const list = document.getElementById('rider-list');
            list.innerHTML = '';
            for(let id in data) {
                const r = data[id];
                if(Date.now() - r.t < 300000) {
                    if(markers[id]) markers[id].setLatLng([r.lat, r.lng]);
                    else markers[id] = L.marker([r.lat, r.lng]).addTo(map).bindTooltip(r.name, {permanent:true});
                    list.innerHTML += `<div>${r.name}: ${r.speed}km/h</div>`;
                }
            }
        });
    }

    async function startTracking() {
        const name = document.getElementById('riderName').value;
        if(!name) return;

        // 1. Start Silent Audio (Tricks OS to keep the tab active)
        const audio = document.getElementById('bgAudio');
        audio.play().catch(e => console.log("Audio play failed, needs user click"));

        // 2. Request WakeLock (Prevents screen from sleeping if possible)
        try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}

        showScreen('screen-rider-active');
        document.getElementById('activeNameDisplay').innerText = name;

        // 3. High Accuracy Watch
        navigator.geolocation.watchPosition(pos => {
            const speed = pos.coords.speed ? Math.floor(pos.coords.speed * 3.6) : 0;
            db.ref('riders/' + name.replace(/\s/g,'_')).set({
                name, lat: pos.coords.latitude, lng: pos.coords.longitude,
                speed, t: Date.now()
            });
            document.getElementById('myStats').innerHTML = `Speed: ${speed} km/h<br>Acc: ${Math.round(pos.coords.accuracy)}m`;
        }, (err) => {
            console.error(err);
        }, { 
            enableHighAccuracy: true, 
            maximumAge: 0, 
            timeout: 10000 
        });
    }
</script>
</body>
</html>
